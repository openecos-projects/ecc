schema_version = 2

[design]
name = "gcd"
top = "gcd"
clock_port = "clk"
frequency_mhz = 100.0

[pdk]
name = "ics55"
root = "/root/ec/pdk/icsprout55-pdk"

[flow]
skip_steps = [
    "lec",
]
start = "Synthesis"
end = "Synthesis"

[params]
max_fanout = 32
target_density = 0.2
target_overflow = 0.1
global_right_padding = 0
cell_padding_x = 200
routability_opt_flag = 1
run_analysis = true
bottom_layer = "MET2"
top_layer = "MET5"
sta_max_paths = 1000

[params.die]
size = []
area = 0

[params.core]
size = []
area = 0
bounding_box = ""
utilitization = 0.4
margin = [
    2,
    2,
]
aspect_ratio = 1
