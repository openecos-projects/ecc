# Signoff CSV lit gates — CI contract profile (not ecc signoff product truth).
#
# Library: test/lit/csv_gates
# Status: v0 / trial — see test/lit/README.md (graduation bar).
# Spec version: only `1` today; bump requires loader + migration note there.

version: 1

tables:
  - qor_summary
  - qor_metrics
  - checklist
  - flow_steps

metrics:
  - id: drc_count
    reference: 0
    op: "=="
  - id: lvs_count
    reference: 0
    op: "=="
  - id: sta_setup_wns
    reference: 0.0
    op: ">="
  - id: sta_hold_wns
    reference: 0.0
    op: ">="

checklist:
  - id: quality.drc.clean
    require_state: pass
    require_blocked: false
  - id: quality.lvs.clean
    require_state: pass
    require_blocked: false
  - id: quality.sta.setup_closed
    require_state: pass
    require_blocked: false
  - id: quality.sta.hold_closed
    require_state: pass
    require_blocked: false

flow_steps:
  - drc
  - lvs
  - sta
  - Harden
