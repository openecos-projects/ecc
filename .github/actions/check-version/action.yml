name: Check ECC Version Consistency
description: Verify pyproject.toml and chipcompiler/__version__ match. Optionally verify a tag matches the version.

inputs:
  expected_tag:
    description: 'Expected tag (e.g., v0.1.0-alpha.3). If provided, also verify the tag matches the version.'
    required: false
    default: ''
  expected_ref:
    description: 'Expected tag or release branch ref. Accepted forms include refs/tags/vX, vX, refs/heads/release/vX, and release/vX.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Verify version consistency
      shell: bash
      env:
        EXPECTED_TAG: ${{ inputs.expected_tag }}
        EXPECTED_REF: ${{ inputs.expected_ref || inputs.expected_tag }}
      run: |
        bash .github/scripts/check-version.sh
