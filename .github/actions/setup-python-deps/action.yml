name: Setup Python Dependencies
description: Setup Python 3.11, uv, and install project dependencies.

inputs:
  build-all:
    description: Build native dependencies from source instead of downloading prebuilt native wheels.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@v3
      with:
        version: latest
        enable-cache: "true"

    - name: Setup uv-managed Python 3.11
      shell: bash
      run: uv python install 3.11

    - name: Trust GitHub workspace
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Install hosted native build dependencies
      shell: bash
      run: |
        dnf install -y epel-release dnf-plugins-core
        dnf config-manager --set-enabled crb || true
        dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
        dnf install -y \
          cmake ninja-build pkgconfig patchelf mold lld \
          boost-devel cairo-devel gflags-devel glog-devel \
          flex flex-devel bison eigen3-devel gtest-devel \
          tbb-devel hwloc-devel libcurl-devel libunwind-devel \
          metis-devel gmp-devel tcl-devel \
          unzip zip gh bzip2

    - name: Install pinned Boost 1.91 for source builds
      if: ${{ inputs.build-all == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        boost_prefix="${RUNNER_TEMP}/ecc-boost-1.91.0"
        bash .github/scripts/install-ci-boost.sh "$boost_prefix"
        echo "ECC_BOOST_ROOT=${boost_prefix}" >> "$GITHUB_ENV"

    - name: Setup Rust
      if: ${{ inputs.build-all == 'true' }}
      uses: dtolnay/rust-toolchain@stable

    - name: Setup sccache
      if: ${{ inputs.build-all == 'true' }}
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Install native tool wheels
      if: ${{ inputs.build-all != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        mkdir -p dist/native-wheels
        uv venv --python 3.11 --managed-python

        .venv/bin/python .github/scripts/download-native-wheel.py \
          "openecos-projects/ecc-dreamplace" \
          "chipcompiler/thirdparty/ecc-dreamplace" \
          "ecc-dreamplace-wheel" dist/native-wheels

        .venv/bin/python .github/scripts/download-native-wheel.py \
          "openecos-projects/ecc-tools" \
          "chipcompiler/thirdparty/ecc-tools" \
          "ecc-tools-wheel" dist/native-wheels

        uv pip install --python .venv/bin/python --no-deps dist/native-wheels/*.whl

    - name: Install Python dependencies
      shell: bash
      run: |
        if [ "${{ inputs.build-all }}" = "true" ]; then
          export SCCACHE_GHA_ENABLED="true"
          export CMAKE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_PREFIX_PATH=${ECC_BOOST_ROOT}"
          # Xplace's native libraries and lookup tables are CMake install
          # artifacts. Inplace editable builds skip installing those files.
          uv sync --frozen --all-groups --python 3.11 --managed-python \
            --config-settings-package ecc-dreamplace=editable.mode=redirect \
            --no-build-isolation-package ecc-dreamplace \
            --no-build-isolation-package ecc-tools-bin \
            --verbose
        else
          uv sync --frozen --all-groups --python 3.11 --managed-python --inexact \
            --no-install-package ecc-dreamplace \
            --no-install-package ecc-tools-bin
        fi
