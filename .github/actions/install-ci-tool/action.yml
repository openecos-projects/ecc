name: Install CI Tool
description: Download a tool archive published by another repository's CI workflow and expose its root on PATH.

inputs:
  repo:
    description: Repository (owner/name) whose CI publishes the tool artifact.
    required: true
  workflow:
    description: Workflow file name that produces the artifact (for example ci.yml).
    required: true
  artifact:
    description: Name of the uploaded artifact to download.
    required: true
  archive:
    description: Archive file name expected inside the downloaded artifact.
    required: true
  root-marker:
    description: File path relative to the tool root used to locate the extracted root directory.
    required: true
  root-env:
    description: Environment variable that receives the resolved tool root path.
    required: true
  branch:
    description: Preferred branch of the source workflow run.
    required: false
    default: main
  fallback-branch:
    description: Branch to use when the preferred branch has no successful run.
    required: false
    default: ""
  github-token:
    description: Token used to query and download the source repository's artifacts.
    required: true

runs:
  using: composite
  steps:
    - name: Download and extract tool
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        resolve_run_id() {
          local branch="$1"
          gh api "repos/${{ inputs.repo }}/actions/workflows/${{ inputs.workflow }}/runs?branch=${branch}&status=success&per_page=1" \
            --jq '[.workflow_runs[] | select(.conclusion == "success") | .id][0] // empty'
        }

        run_id="$(resolve_run_id '${{ inputs.branch }}')"
        if [ -z "$run_id" ] && [ -n '${{ inputs.fallback-branch }}' ]; then
          run_id="$(resolve_run_id '${{ inputs.fallback-branch }}')"
        fi
        if [ -z "$run_id" ]; then
          echo "::error::No successful ${{ inputs.workflow }} run found in ${{ inputs.repo }}"
          exit 1
        fi

        install_root="${RUNNER_TEMP}/${{ inputs.artifact }}"
        mkdir -p "$install_root"
        echo "Downloading ${{ inputs.artifact }} from ${{ inputs.repo }} CI run ${run_id}"
        gh run download "$run_id" \
          --repo "${{ inputs.repo }}" \
          --name "${{ inputs.artifact }}" \
          --dir "$install_root"

        archive="$(find "$install_root" -name '${{ inputs.archive }}' -print -quit)"
        if [ -z "$archive" ]; then
          echo "::error::${{ inputs.archive }} was not in the downloaded artifact"
          exit 1
        fi
        tar -xf "$archive" -C "$install_root"

        marker="$(find "$install_root" -type f -path '*/${{ inputs.root-marker }}' -print -quit)"
        if [ -z "$marker" ]; then
          echo "::error::Extracted artifact is missing ${{ inputs.root-marker }}"
          exit 1
        fi
        tool_root="${marker%/${{ inputs.root-marker }}}"
        if [ -z "$tool_root" ] || [ ! -d "$tool_root" ]; then
          echo "::error::Could not resolve tool root from ${marker}"
          exit 1
        fi

        echo "Installed ${{ inputs.artifact }} at ${tool_root}"
        echo "${tool_root}/bin" >> "$GITHUB_PATH"
        echo "${{ inputs.root-env }}=${tool_root}" >> "$GITHUB_ENV"
