name: Deterministic Signoff CSV

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nix/scripts/signoff_csv/**'
      - 'nix/scripts/signoff-csv-fixture.sh'
      - '.github/scripts/signoff-csv-summary.js'
      - '.github/scripts/signoff-csv-test.sh'
      - 'nix/signoff.nix'
      - '.github/workflows/signoff-csv.yml'
  push:
    branches:
      - 'agency/signoff-csv-standalone'
    paths:
      - 'nix/scripts/signoff_csv/**'
      - 'nix/scripts/signoff-csv-fixture.sh'
      - '.github/scripts/signoff-csv-summary.js'
      - '.github/scripts/signoff-csv-test.sh'
      - 'nix/signoff.nix'
      - '.github/workflows/signoff-csv.yml'

concurrency:
  group: signoff-csv-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  signoff-csv:
    name: Signoff CSV collector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate deterministic workspace
        run: |
          bash nix/scripts/signoff-csv-fixture.sh \
            --workspace "$RUNNER_TEMP/signoff-workspace"

      - name: Export signoff product CSVs
        id: export
        run: |
          mkdir -p signoff-artifacts
          bash nix/scripts/signoff_csv/export.sh \
            --workspace "$RUNNER_TEMP/signoff-workspace" \
            --out-dir signoff-artifacts

      - name: Verify signoff CSV failure modes
        run: bash .github/scripts/signoff-csv-test.sh

      - name: Link previous successful summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! response="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/signoff-csv.yml/runs" \
              -f event="${GITHUB_EVENT_NAME}" \
              -f branch="${HEAD_BRANCH}" \
              -f status=success \
              -f per_page=100
          )"; then
            printf '## Previous successful CI\n\nThe previous successful run could not be retrieved.\n\n' \
              >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          previous_run_url="$(
            jq -r --arg repository "${HEAD_REPOSITORY}" --argjson current "${CURRENT_RUN_ID}" \
              '[.workflow_runs[] | select(
                .id != $current and .head_repository.full_name == $repository
              )][0].html_url // empty' <<< "${response}"
          )"
          if [[ -n "${previous_run_url}" ]]; then
            printf '## Previous successful CI\n\n[View the previous successful Signoff CSV summary](%s)\n\n' \
              "${previous_run_url}" >> "${GITHUB_STEP_SUMMARY}"
          else
            printf '## Previous successful CI\n\nNo previous successful run was found for this source branch.\n\n' \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Publish signoff CSV job summary
        if: always()
        run: node .github/scripts/signoff-csv-summary.js

      - name: Upload CSV evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ecc-signoff-csv
          path: signoff-artifacts/
          if-no-files-found: ignore
          retention-days: 90
