name: Deterministic Signoff CSV

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nix/scripts/signoff_csv/**'
      - 'nix/signoff.nix'
      - '.github/workflows/signoff-csv.yml'
  push:
    branches:
      - 'agency/signoff-csv-standalone'
    paths:
      - 'nix/scripts/signoff_csv/**'
      - 'nix/signoff.nix'
      - '.github/workflows/signoff-csv.yml'

concurrency:
  group: signoff-csv-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  signoff-csv:
    name: Signoff CSV collector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate deterministic workspace
        run: |
          PYTHONPATH="$PWD/nix/scripts" \
          python3 -m signoff_csv.fixture \
            --workspace "$RUNNER_TEMP/signoff-workspace"

      - name: Export signoff product CSVs
        id: export
        run: |
          mkdir -p signoff-artifacts
          PYTHONPATH="$PWD/nix/scripts" \
          python3 -m signoff_csv.cli \
            --workspace "$RUNNER_TEMP/signoff-workspace" \
            --out-dir signoff-artifacts

      - name: Upload CSV evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ecc-signoff-csv
          path: signoff-artifacts/
          if-no-files-found: ignore
          retention-days: 90

      - name: Notify PR with signoff CSV report
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ecc-signoff-csv-report -->';
            let body = `## Signoff CSV Report\n\nExport step failed before producing a manifest.\n\n${marker}\n`;
            const manifestPath = 'signoff-artifacts/signoff_csv_manifest.json';
            if (fs.existsSync(manifestPath)) {
              const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
              const rows = Object.entries(manifest.checks || {})
                .sort(([a], [b]) => a.localeCompare(b))
                .map(([name, data]) =>
                  `| \`${name}\` | \`${data.status || 'fail'}\` | ${data.rows || 0} | \`${data.file || ''}\` |`
                )
                .join('\n');
              body = [
                '## Signoff CSV Report',
                '',
                `- **Workspace**: \`${manifest.workspace || ''}\``,
                `- **Design**: \`${manifest.design || 'unknown'}\``,
                `- **Gate**: \`${manifest.gate || 'FAIL'}\``,
                '',
                '| Check | Status | Rows | CSV |',
                '| --- | --- | --- | --- |',
                rows,
                '',
                marker,
                ''
              ].join('\n');
            }
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100
              }
            );
            const existing = comments.find(
              (comment) =>
                comment.user &&
                comment.user.login === 'github-actions[bot]' &&
                comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
