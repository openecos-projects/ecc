name: Deterministic Signoff CSV

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nix/scripts/signoff_csv/**'
      - '.github/scripts/signoff-csv-notify.js'
      - 'nix/signoff.nix'
      - '.github/workflows/signoff-csv.yml'
  push:
    branches:
      - 'agency/signoff-csv-standalone'
    paths:
      - 'nix/scripts/signoff_csv/**'
      - '.github/scripts/signoff-csv-notify.js'
      - 'nix/signoff.nix'
      - '.github/workflows/signoff-csv.yml'

concurrency:
  group: signoff-csv-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  signoff-csv:
    name: Signoff CSV collector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate deterministic workspace
        run: |
          bash nix/scripts/signoff_csv/fixture.sh \
            --workspace "$RUNNER_TEMP/signoff-workspace"

      - name: Export signoff product CSVs
        id: export
        run: |
          mkdir -p signoff-artifacts
          bash nix/scripts/signoff_csv/export.sh \
            --workspace "$RUNNER_TEMP/signoff-workspace" \
            --out-dir signoff-artifacts

      - name: Upload CSV evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ecc-signoff-csv
          path: signoff-artifacts/
          if-no-files-found: ignore
          retention-days: 90

      - name: Notify PR with signoff CSV report
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/signoff-csv-notify.js
