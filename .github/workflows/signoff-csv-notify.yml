name: Signoff CSV notify

on:
  workflow_run:
    workflows:
      - Deterministic Signoff CSV
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  notify:
    name: Signoff CSV notify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download signoff CSV artifact
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: Deterministic Signoff CSV
          run_id: ${{ github.event.workflow_run.id }}
          name: ecc-signoff-csv
          path: signoff-artifacts
          if_no_artifact_found: ignore

      - name: Notify originating pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: node .github/scripts/signoff-csv-notify.js
