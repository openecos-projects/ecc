name: Signoff CSV PR Notification

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  notify:
    name: Post signoff CSV report
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') }}
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-scripts

      - name: Download signoff CSV artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: '${{ github.event.workflow_run.id }}'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: signoff-artifacts

      - name: Render signoff CSV report
        env:
          GITHUB_STEP_SUMMARY: signoff-comment.md
        run: node trusted-scripts/.github/scripts/signoff-csv-summary.js

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if [[ -z "${PR_NUMBER:-}" || "${PR_NUMBER:-}" == "null" ]]; then
            echo "No pull request associated with this workflow run; skipping notification."
            exit 0
          fi
          if [[ ! -f signoff-artifacts/signoff_csv_manifest.json ]]; then
            echo "No signoff CSV manifest was produced; skipping notification."
            exit 0
          fi
          gh pr comment "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file signoff-comment.md
