name: CI

on:
  workflow_dispatch:
    inputs:
      build-all:
        description: Build native dependencies from source instead of downloading prebuilt native wheels.
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - 'release/v*'
  pull_request:
    paths:
      - 'chipcompiler/**'
      - 'test/**'
      - 'ecc.spec'
      - 'packaging/**'
      - 'hooks/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - 'nix/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  check-version:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version
        uses: ./.github/actions/check-version
        with:
          expected_ref: ${{ startsWith(github.ref, 'refs/heads/release/v') && github.ref || startsWith(github.base_ref, 'release/v') && github.base_ref || '' }}

  test:
    name: Test
    needs: check-version
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          build-all: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['build-all'] == 'true' && 'true' || 'false' }}

      - name: Setup PDK
        run: |
          git clone --depth 1 https://github.com/openecos-projects/icsprout55-pdk.git ../pdk/icsprout55-pdk
          cd ../pdk/icsprout55-pdk && make unzip

      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Yosys
        run: |
          yosys -V
          yosys -p "plugin -i slang"

      - name: Setup Sizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_id="$(
            gh api "repos/openecos-projects/ecc-sizer/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=20" \
              --jq '[.workflow_runs[] | select(.conclusion == "success") | .id][0] // empty'
          )"
          if [ -z "$run_id" ]; then
            echo "::error::No successful ecc-sizer CI artifact found on main"
            exit 1
          fi

          install_root="${RUNNER_TEMP}/ecc-sizer"
          mkdir -p "$install_root"
          echo "Downloading ecc-sizer-linux-x64 from openecos-projects/ecc-sizer CI run ${run_id}"
          gh run download "$run_id" \
            --repo openecos-projects/ecc-sizer \
            --name ecc-sizer-linux-x64 \
            --dir "$install_root"

          archive="$(find "$install_root" -name 'ecc-sizer-linux-x64.tar.gz' -print -quit)"
          if [ -z "$archive" ]; then
            echo "::error::ecc-sizer-linux-x64.tar.gz was not in the downloaded artifact"
            exit 1
          fi
          tar -xzf "$archive" -C "$install_root"

          sizer_root="$(find "$install_root" -type f -path '*/src/sizer_os.tcl' -printf '%h\n' | sed 's#/src$##' | head -n 1)"
          if [ -z "$sizer_root" ] || [ ! -x "${sizer_root}/bin/Sizer" ]; then
            echo "::error::Downloaded ecc-sizer artifact is missing bin/Sizer or src/sizer_os.tcl"
            exit 1
          fi

          echo "${sizer_root}/bin" >> "$GITHUB_PATH"
          echo "CHIPCOMPILER_ECC_SIZER_ROOT=${sizer_root}" >> "$GITHUB_ENV"

      - name: Verify Sizer
        run: |
          command -v Sizer
          test -f "${CHIPCOMPILER_ECC_SIZER_ROOT}/src/sizer_os.tcl"

      - name: Pytest
        run: uv run --no-sync pytest test/ --ignore=test/examples/test_soc.py --cov=chipcompiler --cov-report=

      - name: Upload integration flow logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-flow-logs
          if-no-files-found: ignore
          path: |
            test/examples/*/home/flow.json
            test/examples/**/log/**

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '## Coverage Report'
            echo '```'
            uv run --no-sync coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-pyinstaller:
    name: Build PyInstaller Bundle
    needs: check-version
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          build-all: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['build-all'] == 'true' && 'true' || 'false' }}

      - name: Smoke test native toolchain wheels
        run: |
          .venv/bin/python - <<'PY'
          import ecc_tools_bin.ecc_py  # noqa: F401
          from chipcompiler.tools.ecc.module import ECCToolsModule
          from dreamplace.Params import Params  # noqa: F401
          from dreamplace.Placer import PlacementEngine  # noqa: F401

          assert ECCToolsModule().get_ecc() is not None
          print("ecc-tools wrapper and ecc-dreamplace imports passed")
          PY

      - name: Build PyInstaller bundle
        uses: ./.github/actions/build-pyinstaller-bundle
        with:
          artifact-path: dist/ecc.tar
          artifact-format: tar

      - name: Upload PyInstaller artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecc-cli-linux-x86_64
          if-no-files-found: ignore
          path: |
            dist/ecc.tar

  lint:
    needs: check-version
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python dependencies
        uses: ./.github/actions/setup-python-deps

      - name: Ruff format check
        run: uv run --no-sync ruff format --check chipcompiler test

      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github chipcompiler test

      # - name: Pyright
      #   run: uv run pyright chipcompiler
