name: CI

on:
  workflow_dispatch:
    inputs:
      build-all:
        description: Build native dependencies from source instead of downloading prebuilt native wheels.
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - 'release/v*'
  pull_request:
    paths:
      - 'chipcompiler/**'
      - 'agent/**'
      - 'test/**'
      - 'ecc.spec'
      - 'packaging/**'
      - 'hooks/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - 'nix/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  check-version:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version
        uses: ./.github/actions/check-version
        with:
          expected_ref: ${{ startsWith(github.ref, 'refs/heads/release/v') && github.ref || startsWith(github.base_ref, 'release/v') && github.base_ref || '' }}

  test:
    name: Test
    needs: check-version
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          build-all: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['build-all'] == 'true' && 'true' || 'false' }}

      - name: Setup PDK
        run: |
          git clone --depth 1 https://github.com/openecos-projects/icsprout55-pdk.git ../pdk/icsprout55-pdk
          cd ../pdk/icsprout55-pdk && make unzip

      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Yosys
        run: |
          yosys -V
          yosys -p "plugin -i slang"

      - name: Setup Sizer
        uses: ./.github/actions/install-ci-tool
        with:
          repo: openecos-projects/ecc-sizer
          workflow: ci.yml
          artifact: ecc-sizer-linux-x64
          archive: ecc-sizer-linux-x64.tar.gz
          root-marker: src/sizer_os.tcl
          root-env: CHIPCOMPILER_ECC_SIZER_ROOT
          github-token: ${{ github.token }}

      - name: Verify Sizer
        run: |
          command -v Sizer
          test -f "${CHIPCOMPILER_ECC_SIZER_ROOT}/src/sizer_os.tcl"

      - name: Setup kepler-formal
        uses: ./.github/actions/install-ci-tool
        with:
          repo: openecos-projects/kepler-formal
          workflow: package.yml
          artifact: kepler-formal-linux-x64
          archive: kepler-formal-linux-x64.tar.gz
          root-marker: bin/kepler-formal
          root-env: CHIPCOMPILER_KEPLER_FORMAL_ROOT
          # TODO: drop once the kepler-formal package workflow runs on main.
          fallback-branch: emin/add-ci-pkgs
          github-token: ${{ github.token }}

      - name: Verify kepler-formal
        run: |
          command -v kepler-formal
          "${CHIPCOMPILER_KEPLER_FORMAL_ROOT}/bin/kepler-formal" --version

      - name: Pytest
        run: uv run --no-sync pytest test/ -v --basetemp=pytest-tmp --cov=chipcompiler --cov-report=

      - name: Pytest (agent)
        run: uv run --no-sync pytest agent/test -v --basetemp=pytest-agent-tmp

      - name: Prune test fixture symlinks before log upload
        if: failure()
        run: find pytest-tmp -type l -delete

      - name: Upload integration flow logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-flow-logs
          if-no-files-found: ignore
          path: |
            pytest-tmp/**/home/flow.json
            pytest-tmp/**/log/**
            pytest-tmp/**/data/**/*.log

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '## Coverage Report'
            echo '```'
            uv run --no-sync coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-pyinstaller:
    name: Build PyInstaller Bundle
    needs: check-version
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          build-all: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['build-all'] == 'true' && 'true' || 'false' }}

      - name: Smoke test native toolchain wheels
        run: |
          .venv/bin/python - <<'PY'
          import ecc_tools_bin.ecc_py  # noqa: F401
          from chipcompiler.tools.ecc.module import ECCToolsModule
          from dreamplace.Params import Params  # noqa: F401
          from dreamplace.Placer import PlacementEngine  # noqa: F401

          assert ECCToolsModule().get_ecc() is not None
          print("ecc-tools wrapper and ecc-dreamplace imports passed")
          PY

      - name: Build PyInstaller bundle
        uses: ./.github/actions/build-pyinstaller-bundle
        with:
          artifact-path: dist/ecc.tar
          artifact-format: tar

      - name: Upload PyInstaller artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecc-cli-linux-x86_64
          if-no-files-found: ignore
          path: |
            dist/ecc.tar

  lint:
    needs: check-version
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python dependencies
        uses: ./.github/actions/setup-python-deps

      - name: Ruff format check
        run: uv run --no-sync ruff format --check chipcompiler test agent

      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github chipcompiler test agent

      # - name: Pyright
      #   run: uv run pyright chipcompiler
