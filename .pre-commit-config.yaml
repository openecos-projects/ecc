default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        name: Ruff lint
        stages:
          - pre-commit
      - id: ruff-format
        name: Ruff format
        stages:
          - pre-commit

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        name: Check commit message format
        stages:
          - commit-msg
        args:
          - --verbose
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert

  - repo: local
    hooks:
      - id: no-subject-full-stop
        name: Commit subject must not end with a full stop
        language: system
        stages:
          - commit-msg
        entry: >-
          bash -c 'subject=$(head -n1 "$1");
          case "$subject" in "fixup! "*|"squash! "*|"amend! "*|"Merge "*) exit 0;; esac;
          case "$subject" in *.) echo "error: commit subject must not end with a full stop" >&2; exit 1;; esac' --
